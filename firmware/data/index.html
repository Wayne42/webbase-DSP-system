<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP 32 local</title>
    <!-- Verlinkung zur externen CSS-Datei -->
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <!-- Haupt-Wrapper für alle Container (Pre, Filter, Post) -->
    <div class="container-wrapper">

        <!-- =======================
             Pre Filter Sektion
             ======================= -->
        <div class="container">
            <h1>Metering</h1>

            <!-- Signal-LED-Anzeige -->
            <label for="signalLedL">Signal:</label>
            <p id="outputSignalLeds" class="outputText"></p>
            <div class="led-container">
                <div class="led-unit">
                    <p id="channelSignalLedL" class="outputText"></p>
                    <span id="signalLedL" class="led"></span>
                    <p id="outputSignalLedL" class="outputText">L</p>
                </div>
                <div class="led-unit">
                    <p id="channelSignalLedR" class="outputText"></p>
                    <span id="signalLedR" class="led"></span>
                    <p id="outputSignalLedR" class="outputText">R</p>
                </div>
            </div>

            <h1>Pre Filter</h1>

            <!-- Gain-Eingabe -->
            <label for="gainPreInput">Gain:</label>
            <input type="range" id="gainPreInput" placeholder="z.B. 0 dB">
            <button id="gainPreSend">Absenden</button>

            <!-- Ausgabe für Debug-Zwecke -->
            <p id="outputGainPre" class="outputText"></p>
        </div>

        <!-- =======================
             Filter Sektionen
             Die Filter 1 ... FILTER_COUNT werden in app.js aus dem
             Template #filterTemplate erzeugt und hier eingefügt
             ======================= -->
        <template id="filterTemplate">
            <div class="container filter-container">
                <div class="filter-header">
                    <h1 data-role="title">Filter</h1>
                    <button data-role="bypass" class="bypass-btn">Bypass</button>
                </div>

                <!-- Filtertyp -->
                <label data-role="typeLabel">Typ:</label>
                <select data-role="type">
                    <option value="bell">Bell</option>
                </select>

                <!-- Filterparameter -->
                <label data-role="freqLabel">Frequenz:</label>
                <input type="text" data-role="freq" placeholder="z.B. 440 Hz">

                <label data-role="gainLabel">Gain:</label>
                <input type="text" data-role="gain" placeholder="z.B. 10dB">

                <label data-role="qLabel">Q:</label>
                <input type="text" data-role="q" placeholder="z.B. 1">

                <button data-role="send">Absenden</button>
                <p data-role="output" class="outputText"></p>
            </div>
        </template>

        <!-- =======================
             Post Filter Sektion
             ======================= -->
        <div class="container" id="postFilterContainer">
            <h1>Post Filter</h1>

            <!-- Gain für Post-Filter -->
            <label for="gainPost">Gain:</label>
            <input type="text" id="gainPostInput" placeholder="z.B. 0 dB">
            <button id="gainPostSend">Absenden</button>
            <p id="outputGainPost" class="outputText"></p>

            <!-- Mute Schalter -->
            <label for="muteCheckbox">Mute:</label>
            <label class="switch">
                <input type="checkbox" id="muteCheckbox">
                <span class="slider"></span>
            </label>
            <p id="outputMute" class="outputText"></p>
        </div>

    </div> <!-- Ende container-wrapper -->

    <!-- Einbindung der JavaScript-Logik -->
    <script src="app.js"></script>
</body>

</html>
